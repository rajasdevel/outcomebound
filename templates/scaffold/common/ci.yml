# An independent check of every change: Done, then OutcomeBound's install check.
# Supply-chain controls: each action is pinned by commit, the only reference that cannot move,
# and the job's token can only read the repository.
# Written by the OutcomeBound scaffold; this file is the project's own.
name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Later steps run code from the pull request; they do not keep the token.
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # A step that puts Done's tools on PATH goes here, before Done.
      - name: Done
        run: "<<fill: the Done command>>"
      - name: Install OutcomeBound
        # The release this file shipped with; change it in the same change as an upgrade.
        run: python -m pip install "outcomebound==1.9.0"
      - name: OutcomeBound install check
        run: outcomebound adopt . --check
