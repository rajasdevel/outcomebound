name: main-green

# main accepts a pull request whose own checks pass on the pull request merged onto main, with no
# requirement that the branch is up to date. Two pull requests that each pass alone can then fail
# together on main. This workflow closes the tree when that happens: the commit status
# `main-green`, which the ruleset requires, fails on every open pull request while the last
# completed CI run on main failed, so nothing lands but the fix. A pull request labelled
# `main-fix` passes it, so the fix or the revert can land. When main's CI run passes again, every
# open pull request passes it again.
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, labeled, unlabeled]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# It reads the runs of CI and writes commit statuses; it reads and writes nothing else.
permissions:
  actions: read
  statuses: write
  pull-requests: read

jobs:
  # Not named main-green: the job always passes, and the required check is the status it sets.
  set-main-green:
    runs-on: ubuntu-latest
    steps:
      - name: Set main-green on the open pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -eu
          # The last completed CI run of a push to main decides; a run still going changes
          # nothing until it ends.
          conclusion="$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?branch=main&event=push&status=completed&per_page=1" --jq '.workflow_runs[0].conclusion // "none"')"
          url="$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?branch=main&event=push&status=completed&per_page=1" --jq '.workflow_runs[0].html_url // ""')"
          if [ "$EVENT" = "pull_request" ]; then
            numbers="$PR_NUMBER"
          else
            numbers="$(gh api "repos/$REPO/pulls?state=open&base=main&per_page=100" --jq '.[].number')"
          fi
          for number in $numbers; do
            pr="$(gh api "repos/$REPO/pulls/$number")"
            head="$(printf '%s' "$pr" | jq -r '.head.sha')"
            fix="$(printf '%s' "$pr" | jq -r '[.labels[].name] | index("main-fix") != null')"
            if [ "$conclusion" = "success" ]; then
              state=success; text="main's last CI run passed"
            elif [ "$fix" = "true" ]; then
              state=success; text="main is red; this pull request is labelled main-fix"
            else
              state=failure; text="main is red ($conclusion): only a pull request labelled main-fix lands until it passes"
            fi
            gh api "repos/$REPO/statuses/$head" -f state="$state" -f context=main-green \
              -f description="$text" -f target_url="$url" >/dev/null
            echo "#$number $head: $state, $text"
          done
