name: main-green

# main accepts a pull request whose own checks pass on the pull request merged onto main, with no
# requirement that the branch is up to date. Two pull requests that each pass alone can then fail
# together on main. This workflow closes the tree when that happens: the commit status
# `main-green`, which the ruleset requires, fails on every open pull request while the last
# completed CI run on main failed, so nothing lands but the fix. A pull request labelled
# `main-fix` passes it, so the fix or the revert can land. When main's CI run passes again, every
# open pull request passes it again.
#
# The status lags the event that sets it: this workflow starts after the CI run ends, so a merge
# in flight is not a closed tree, and a pull request can land in that gap. Only an agent that lands
# a fix or a revert applies `main-fix`; GitHub does not enforce that, so it is the agents' rule.
#
# `pull_request_target` runs this file as main holds it, with a token that can write a status on
# a fork's pull request too. The job checks out nothing and runs no code from a pull request: it
# reads the API and writes statuses.
on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, labeled, unlabeled]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# One run at a time, never cancelled: each run reads main's CI and every open pull request afresh
# when it starts, so the last run to start writes the last statuses, and an older run cannot write
# over a newer one. Where a newer run waits, GitHub replaces a run that is still pending, and the
# job of that replaced run can show as cancelled; the newer run sets the statuses.
concurrency:
  group: main-green
  cancel-in-progress: false

# It reads the runs of CI and the pull requests, and writes commit statuses; nothing else.
permissions:
  actions: read
  statuses: write
  pull-requests: read

jobs:
  # Not named main-green: the job always passes, and the required check is the status it sets.
  set-main-green:
    runs-on: ubuntu-latest
    steps:
      - name: Set main-green on every open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          # The last completed CI run on main decides; a run still going changes
          # nothing until it ends. One answer gives both its conclusion and its page.
          # A run started by hand on main counts as a push's does.
          last="$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?branch=main&status=completed&per_page=20" \
            --jq '[.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch")][0] // {}
              | [(.conclusion // "none"), (.html_url // "")] | @tsv')"
          conclusion="${last%%$'\t'*}"
          url="${last#*$'\t'}"
          gh api --paginate "repos/$REPO/pulls?state=open&base=main&per_page=100" \
            --jq '.[] | [.number, .head.sha, ([.labels[].name] | index("main-fix") != null)] | @tsv' |
          while IFS=$'\t' read -r number head fix; do
            if [ "$conclusion" = "success" ]; then
              state=success; text="main's last CI run passed"
            elif [ "$fix" = "true" ]; then
              state=success; text="main is red; this pull request is labelled main-fix"
            else
              state=failure; text="main is red ($conclusion): only a pull request labelled main-fix lands until it passes"
            fi
            gh api "repos/$REPO/statuses/$head" -f state="$state" -f context=main-green \
              -f description="$text" -f target_url="$url" >/dev/null
            echo "#$number $head: $state, $text"
          done
