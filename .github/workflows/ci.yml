name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  # A person or an agent starts a run on main by hand (`gh workflow run ci.yml --ref main`) where
  # a push to main got no run, so a release commit can still show a passing run on main. The
  # floor's base is then HEAD~1: the one squash commit that HEAD is.
  workflow_dispatch:

# A newer push to a pull request cancels the run on its older head, which can never merge; the
# new run reads the whole pull request from its base, so the floor's loosening check reads every
# commit. A push to main or a tag is never cancelled: each run's group is its own commit, since the
# loosening check of a push reads the commits since the commit that push replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The job reads the repository, and on a tag the runs of CI, and writes nothing back to it.
permissions:
  contents: read
  actions: read

# A text read or write that names no encoding warns, and pytest.ini makes the warning an error, so
# the default encoding (the code page on Windows) is caught on every platform, not only there.
env:
  PYTHONWARNDEFAULTENCODING: "1"

jobs:
  # A tag run checks the tag once, not in each leg of the matrix: annotated, v<VERSION>, on this
  # commit, and the changelog and CI template agreeing with it (scripts/release-check.py). The
  # `release` job needs this job, so a tag that fails the check publishes nothing.
  verify-tag:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # A checkout can leave the tag lightweight (actions/checkout before v6.0.2 did); fetch
          # the annotated tag before reading it.
          git fetch --force --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          python3 scripts/release-check.py --tag "$RELEASE_TAG"

  # Decides how much of the Python matrix this run needs. A change can differ by Python version
  # only through the code that runs, so a pull request whose every changed path is outside the
  # list below (text for people, a design, a skill, a fixture of the evals) runs the newest Python
  # only. A push to `main`, a release tag, a run by hand and any pull request that changes a path
  # on the list run every Python. The list is here, in the workflow, and the author of a change
  # does not choose it. A path that cannot be read, or whose name Git quotes, counts as on the
  # list. The job names that the ruleset requires, `test (3.10)` and `test (3.14)`, stay: the job
  # `test` below reports them in both cases.
  plan:
    runs-on: ubuntu-latest
    outputs:
      pythons: ${{ steps.plan.outputs.pythons }}
      windows: ${{ steps.plan.outputs.windows }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pull request's change is read against its base commit.
          fetch-depth: 0
          persist-credentials: false

      - name: Plan the matrix
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          full=true
          reason="a run that is not a pull request runs every Python"
          if [ "$EVENT" = pull_request ]; then
            changed="$(mktemp)"
            if git -c core.quotePath=false diff --name-only --no-renames "$BASE" HEAD > "$changed"; then
              full=false
              reason="no changed path is on the list, so one Python is enough"
              while IFS= read -r path; do
                case "$path" in
                  # Text and data that no Python runs: not on the list.
                  evals/fixtures/* | evals/*.md) ;;
                  '"'* | outcomebound_tools/* | scripts/* | tests/* | .github/* | evals/* | \
                  pyproject.toml | requirements-dev.txt | Makefile | pytest.ini | mypy.ini | \
                  ruff.toml | VERSION | .gitattributes)
                    full=true
                    reason="$path is on the list, so every Python runs"
                    break
                    ;;
                esac
              done < "$changed"
            else
              reason="the changed paths could not be read, so every Python runs"
            fi
          fi
          if [ "$full" = true ]; then
            pythons='["3.10","3.11","3.12","3.13","3.14"]'
            windows='["3.10","3.14"]'
          else
            pythons='["3.14"]'
            windows='["3.14"]'
          fi
          echo "$reason: Linux $pythons, Windows $windows"
          echo "pythons=$pythons" >> "$GITHUB_OUTPUT"
          echo "windows=$windows" >> "$GITHUB_OUTPUT"

  # The checks that run once for the change, on the newest Python: the quality floor with its
  # tools from requirements-dev.txt, the public-text claim, and a proof that the shards below
  # are the whole suite. They no longer wait behind the suite. `test (3.14)` needs them.
  checks:
    runs-on: ubuntu-latest
    steps:
      # Each action is pinned by commit, the only reference that cannot move; the comment names
      # the release it is.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The floor's loosening check reads the commits since its base, so the
          # clone holds the whole history.
          fetch-depth: 0
          # Later steps run code from the pull request; they do not keep the token.
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          # The pip cache is keyed by the hash of the pinned requirements, so a changed pin
          # is a new cache.
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # pytest and xdist for the suite, and the floor's ruff and mypy, as pinned.
      - name: Install the development tools
        run: python -m pip install -r requirements-dev.txt

      # The floor's secrets claim runs gitleaks, pinned here by version and published checksum.
      # The download takes under a second, so it is not cached.
      - name: Install gitleaks
        run: |
          case "$(uname -m)" in
            x86_64) arch=x64 sum=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb ;;
            aarch64 | arm64) arch=arm64 sum=e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080 ;;
            *) echo "no pinned gitleaks for $(uname -m)"; exit 1 ;;
          esac
          tarball="gitleaks_8.30.1_linux_$arch.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$tarball"
          echo "$sum  $RUNNER_TEMP/$tarball" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      # The floor's base is what this run's change replaces: a pull request's
      # base, or the commit a push replaced -- all zeros for a new ref such as a tag,
      # which falls back to HEAD~1. A root commit has no base, so the floor reads the
      # tracked files instead. The value reaches the shell through the environment.
      - name: Quality floor
        env:
          OUTCOMEBOUND_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$OUTCOMEBOUND_BASE"
          case "$base" in "" | 0000000000000000000000000000000000000000) base=HEAD~1 ;; esac
          if git rev-parse -q --verify "$base^{commit}" >/dev/null; then
            scripts/outcomebound floor check . --base "$base"
          else
            scripts/outcomebound floor check .
          fi

      # The floor's public-text claim reads home paths and email addresses with no list. This
      # step adds the local list of private names, from the repository secret OB_SCRUB_LIST, over
      # the tracked files and the commit messages since the same base. A run without the secret, such as a fork's
      # pull request, reads UNVERIFIED for the list and does not fail on it: a maintainer runs
      # `make scrub` before the merge. A pull request's title and body are checked by the
      # workflow pr-text.yml, which runs again when they are edited. Each value reaches the
      # shell through the environment.
      - name: Public text
        env:
          OB_SCRUB_LIST_TEXT: ${{ secrets.OB_SCRUB_LIST }}
          OUTCOMEBOUND_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$OB_SCRUB_LIST_TEXT" ]; then
            printf '%s\n' "$OB_SCRUB_LIST_TEXT" > "$RUNNER_TEMP/scrub-list.txt"
            export OB_SCRUB_LIST="$RUNNER_TEMP/scrub-list.txt"
            base="$OUTCOMEBOUND_BASE"
            case "$base" in "" | 0000000000000000000000000000000000000000) base=HEAD~1 ;; esac
            if git rev-parse -q --verify "$base^{commit}" >/dev/null; then
              python3 scripts/check-public-text.py --private --base "$base"
            else
              python3 scripts/check-public-text.py --private
            fi
          else
            echo "UNVERIFIED public-text: no local list (no OB_SCRUB_LIST secret in this run); a maintainer runs make scrub before the merge"
          fi

      # The suite runs in shards, each job one part picked by test id (tests/conftest.py). The
      # counts are the ones the jobs below use: 3 for Linux, 2 for Windows and the Debian
      # container. A test that is in no part, or in two, fails here, and no job would say so.
      - name: Shards are the whole suite
        run: python scripts/check-test-shards.py 3 2

  # The suite on every Python of the plan, in three shards each. The suite on one Python was the
  # critical path of a pull request; each shard is a third of it, picked by test id, so the set
  # of tests that CI runs is the same. `fail-fast` is off, so one failing shard does not hide the
  # others, and a re-run of the failed shard is enough. The job `test` below is the name the
  # ruleset requires.
  suite:
    needs: [plan]
    name: suite (${{ matrix.python-version }}, ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every push to main, every release tag and every pull request that changes code runs each
        # Python this project supports: the standard library differs between them (Path.exists
        # raises PermissionError under an unreadable folder up to 3.13 and returns False on 3.14).
        # The plan job names the Pythons.
        python-version: ${{ fromJSON(needs.plan.outputs.pythons) }}
        shard: ["1/3", "2/3", "3/3"]
    env:
      OUTCOMEBOUND_TEST_SHARD: ${{ matrix.shard }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tests read the history of the repository they run in.
          fetch-depth: 0
          # Later steps run code from the pull request; they do not keep the token.
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # The oldest Python leg also checks the supported Git minimum. Build tools are CI-only;
      # the installed engine does not need them. The checksum comes from kernel.org's
      # sha256sums.asc. The other legs keep their platform's Git. The build takes about a minute and a
      # half, and the result depends on the pinned version and the runner image only, so it is
      # cached by those: a changed pin or a new image is a new cache.
      - name: Name the runner image
        if: matrix.python-version == '3.10'
        id: image
        run: echo "name=$(. /etc/os-release && echo "$ID-$VERSION_ID")-$(uname -m)" >> "$GITHUB_OUTPUT"

      - name: Restore Git 2.52.0
        if: matrix.python-version == '3.10'
        id: git-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/git-minimum
          key: git-minimum-2.52.0-${{ steps.image.outputs.name }}

      - name: Build Git 2.52.0
        if: matrix.python-version == '3.10' && steps.git-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential libcurl4-openssl-dev libexpat1-dev gettext zlib1g-dev xz-utils
          archive="$RUNNER_TEMP/git-2.52.0.tar.xz"
          curl -fsSLo "$archive" https://www.kernel.org/pub/software/scm/git/git-2.52.0.tar.xz
          echo "3cd8fee86f69a949cb610fee8cd9264e6873d07fa58411f6060b3d62729ed7c5  $archive" | sha256sum -c -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          make -C "$RUNNER_TEMP/git-2.52.0" -j"$(nproc)" prefix="$RUNNER_TEMP/git-minimum" NO_TCLTK=YesPlease install

      - name: Select Git 2.52.0
        if: matrix.python-version == '3.10'
        run: |
          prefix="$RUNNER_TEMP/git-minimum"
          test "$("$prefix/bin/git" --version)" = "git version 2.52.0"
          echo "$prefix/bin" >> "$GITHUB_PATH"
          echo "GIT_EXEC_PATH=$prefix/libexec/git-core" >> "$GITHUB_ENV"

      - name: Verify minimum Git selection
        if: matrix.python-version == '3.10'
        run: |
          test "$(git --version)" = "git version 2.52.0"
          test "$(git --exec-path)" = "$RUNNER_TEMP/git-minimum/libexec/git-core"

      - name: Standard-library boundary gate
        run: make gate

      # This repository's own install: each block and file adopt recorded reads current.
      - name: Own install
        run: scripts/outcomebound adopt . --check

      # pytest and xdist for the suite, as pinned.
      - name: Install the development tools
        run: python -m pip install -r requirements-dev.txt

      # -o addopts="" clears pytest.ini's defaults, so -rs has to be repeated
      # here: every skipped native-tool check must report its reason, because
      # an invisible skip reads as a pass. A displayed skip stays UNVERIFIED.
      # -n auto spreads the shard across the runner's CPUs; --basetemp gives each
      # job its own temporary tree, so jobs sharing a host never collide in it.
      # --durations=25 prints the slowest tests of the shard, which the next profile reads.
      # The shard reaches pytest through OUTCOMEBOUND_TEST_SHARD, set for the job.
      # The base folder reaches the command through the environment, so that the command is
      # plain text, which the project facts read.
      - name: Run test suite
        env:
          PYTEST_BASETEMP: ${{ runner.temp }}/pytest-${{ matrix.python-version }}
        run: python -m pytest -o addopts="" -q -rs -n auto --durations=25 --basetemp="$PYTEST_BASETEMP"

  # The names the ruleset requires: `test (3.10)` and `test (3.14)`. Each passes only when the
  # plan, the checks and every shard of every Python in the plan passed, so it keeps its meaning
  # (the suite on that Python, the floor and the rest passed) and a Python the plan left out
  # cannot hide a failure of the ones it kept. The job runs even when one of those failed, to say so.
  test:
    if: ${{ always() }}
    needs: [plan, checks, suite]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - name: Read the jobs behind this name
        env:
          PLAN: ${{ needs.plan.result }}
          CHECKS: ${{ needs.checks.result }}
          SUITE: ${{ needs.suite.result }}
          PYTHONS: ${{ needs.plan.outputs.pythons }}
          PYTHON: ${{ matrix.python-version }}
        run: |
          echo "plan: $PLAN; checks: $CHECKS; suite: $SUITE; Pythons in the plan: $PYTHONS"
          case "$PYTHONS" in
            *"\"$PYTHON\""*) echo "$PYTHON is in the plan: its shards ran." ;;
            *) echo "$PYTHON is not in the plan: no changed path can differ by Python version, and the newest Python ran." ;;
          esac
          [ "$PLAN" = success ] && [ "$CHECKS" = success ] && [ "$SUITE" = success ]

  # The engine on Windows, on a hosted Windows runner: the suite at the oldest and the newest
  # Python this project supports, as the plan allows, each in two shards. Nobody on the project
  # runs Windows, so this job is the evidence.
  windows:
    needs: [plan]
    name: windows (${{ matrix.python-version }}, ${{ matrix.shard }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.plan.outputs.windows) }}
        shard: ["1/2", "2/2"]
    env:
      OUTCOMEBOUND_TEST_SHARD: ${{ matrix.shard }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install the development tools
        run: python -m pip install -r requirements-dev.txt

      # PowerShell is this runner's default shell, so the variable reads `$env:` there.
      - name: Run test suite
        env:
          PYTEST_BASETEMP: ${{ runner.temp }}\pytest-${{ matrix.python-version }}
        run: python -m pytest -o addopts="" -q -rfEs --tb=line -n auto -p no:cacheprovider --durations=25 --basetemp="$env:PYTEST_BASETEMP"

  # The engine inside containers: a Debian slim image, where the job runs as root, and an Alpine
  # image, with busybox sh and musl. Neither image has Git until the job installs it. The slim
  # image is the longer run, so it is two shards; Alpine is one.
  container:
    name: container (${{ matrix.image }}, ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: "python:3.13-slim"
            shard: "1/2"
          - image: "python:3.13-slim"
            shard: "2/2"
          - image: "python:3.13-alpine"
            shard: "1/1"
    container: ${{ matrix.image }}
    env:
      OUTCOMEBOUND_TEST_SHARD: ${{ matrix.shard }}
    steps:
      - name: Install Git
        run: |
          if command -v apk >/dev/null; then apk add --no-cache git; else apt-get update -qq && apt-get install -y -qq git >/dev/null; fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The same script `make test-containers` runs on a developer's machine: the development
      # tools (one retry on a network reset), the checkout trusted for root, and the suite.
      - name: Run test suite
        run: sh scripts/container-suite.sh

  # A release tag is published only after the tag check and every Linux, Windows and container
  # job pass. The job needs all four, so a failed check publishes nothing. It builds the wheel and
  # source archive from the tagged commit (reproducible: dated from the commit), attests
  # them with signed build
  # provenance, and attaches them to a draft release whose notes are the tag's changelog
  # section. Then it publishes the draft. Where the repository has immutable releases on, the
  # published release, its tag and its files cannot change. Only this job can write, and only
  # here: the release, the provenance signature and its record.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify-tag, test, windows, container]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Build the wheel and the source archive
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" python3 scripts/build_backend.py --sdist --out dist
          ls -l dist

      # Each kit as its file and as an archive, attached to the release beside the package. The
      # `pypi` job downloads only the wheel and the source archive.
      - name: Build the kits
        run: |
          python3 scripts/build-kits.py dist
          ls -l dist

      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      # The notes are the changelog section of the tag's version: from its `## [<version>]`
      # heading to the next `## [` heading. scripts/release-check.py has already checked in
      # `verify-tag` that the section exists and names this version.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          awk -v head="## [$version]" 'index($0, head) == 1 { found = 1; next } found && /^## \[/ { exit } found' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md"
          gh release create "$RELEASE_TAG" dist/* --draft --verify-tag --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/notes.md"
          gh release edit "$RELEASE_TAG" --draft=false

  # The two files of the published release go to PyPI, only after the `release` job, so PyPI
  # holds the bytes that carry the build provenance. A version on PyPI can never be replaced.
  # The upload uses trusted publishing (OpenID Connect): no token or password is stored. The job
  # runs in the GitHub environment `pypi`, and PyPI's publisher for this project names this
  # workflow file and that environment. `id-token: write` is granted to this job only; it reads
  # the release and writes nothing to the repository. The job runs no repository code: it has no
  # checkout.
  pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the release files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir dist --pattern '*.whl' --pattern '*.tar.gz'
          ls -l dist
          test "$(ls dist | wc -l)" -eq 2

      # A re-run after a partial upload skips the file PyPI already holds and uploads the rest;
      # PyPI refuses a different file under a name it holds, so nothing is replaced.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true
