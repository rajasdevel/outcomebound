# chatsvc settings; every key is described in docs/configuration.md.

[service]
listen = 127.0.0.1:8080
limits = config/limits.conf
feedback = data/feedback.jsonl

[provider]
base = https://provider.example.invalid

[route:primary]
path = /v1/chat
key = pool-a
default_model = chat-large-3
aliases = large=chat-large-3, small=chat-small-3
max_attempts = 3
timeout = 20

[embed]
path = /v1/embed
key = pool-a
model = embed-small-1
max_batch = 16
