# Inbound limits per caller key (docs/limits.md). These protect chatsvc and the provider keys
# behind it; raising one is a capacity decision, recorded in docs/limits.md with its reason.

limit_req_zone $api_key zone=chat_v1:1m rate=10r/s;
limit_req_zone $api_key zone=embed:1m rate=20r/m;
limit_req_zone $api_key zone=feedback:1m rate=1r/s;
limit_req_status 429;

location /v1/chat {
    limit_req zone=chat_v1 burst=20 nodelay;
    client_max_body_size 64k;
}

location /v1/embed {
    limit_req zone=embed burst=5 nodelay;
    client_max_body_size 256k;
}

location /v1/feedback {
    limit_req zone=feedback burst=5 nodelay;
    client_max_body_size 8k;
}
