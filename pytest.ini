[pytest]
testpaths = tests
python_files = test_*.py
# -rs displays every skip reason: a skipped native-tool check is UNVERIFIED,
# and an invisible skip reads as a pass.
addopts = -q -rs
# A file read, write or text-mode subprocess that names no encoding uses the platform's default,
# which is UTF-8 on macOS and Linux and the code page on Windows: it passes here and fails only
# on Windows. With PYTHONWARNDEFAULTENCODING=1 (Makefile and CI set it), Python warns at each such
# call, and this makes the warning an error on every platform.
filterwarnings =
    error::EncodingWarning
# A passing test's temporary directories are deleted when the run ends; only a failed
# test's stay to inspect. Kept for every test, a full run's fixture repositories fill
# several gigabytes, and pytest keeps three runs.
tmp_path_retention_policy = failed
