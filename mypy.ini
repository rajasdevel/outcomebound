; This repository's own mypy config. `outcomebound floor check` runs mypy from the
; repository root, so mypy reads this file as it always does.
;
; Not strict: annotation completeness is not a defect class here. check_untyped_defs
; type-checks every function body, annotated or not, and the engine's own functions
; must carry annotations (the section below).
[mypy]
files = .
; Module names come from the directories, so two same-named modules in different
; directories are two modules.
explicit_package_bases = True
namespace_packages = True
exclude = (^|/)(\.git|\.hg|\.venv|venv|node_modules|vendor|__pycache__|\.tox|\.nox|dist|build|target|\.outcomebound|\.outcomebound\-checks|\.mypy_cache|\.ruff_cache|\.pytest_cache)/
python_version = 3.10
strict = False
check_untyped_defs = True
warn_unreachable = True

[mypy-outcomebound_tools.*]
disallow_untyped_defs = True
